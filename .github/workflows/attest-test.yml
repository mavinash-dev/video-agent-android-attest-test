name: Attest test

on:
  push:
    branches:
      - attest-test

permissions:
  contents: read

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release files
        run: ./gradlew --no-daemon publishToMavenLocal -Dmaven.repo.local="$RUNNER_TEMP/m2"

      - name: Collect files
        id: collect
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/m2/com/github/newrelic" -type f \( -name '*.aar' -o -name '*.pom' -o -name '*.module' \) -exec cp {} "$RUNNER_TEMP/release/" \;
          { echo 'list<<EOF'; ls "$RUNNER_TEMP"/release/*; echo EOF; } >> "$GITHUB_OUTPUT"
          echo "version=$(grep '^GLOBAL_VERSION_NAME=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Integrity manifest
        id: manifest
        uses: mavinash-dev/video-core-js-provenance-check/.github/actions/integrity-manifest@378ab5ab740719e51aebe146424a8c4f4ea607a8
        with:
          name: video-agent-android
          version: ${{ steps.collect.outputs.version }}
          tag: v${{ steps.collect.outputs.version }}
          commit: ${{ github.sha }}
          files: ${{ steps.collect.outputs.list }}
          output-dir: ${{ runner.temp }}/integrity

      - name: Add the manifest files to the release folder
        run: cp "$RUNNER_TEMP"/integrity/integrity-manifest.json "$RUNNER_TEMP"/integrity/SHA256SUMS "$RUNNER_TEMP/release/"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release/*

      - name: Upload files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release/*
